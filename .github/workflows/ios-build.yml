name: iOS Build IPA

on:
  push:
    tags:
      - 'V.*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and IPA
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install

      - name: Initialize Capacitor iOS
        run: |
          mkdir -p www
          cp index.html www/
          cp -r "Android, iOS y web/web" www/
          npx cap sync ios
          cd ios/App
          pod install

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION=$(grep "versionName =" "Android, iOS y web/app/build.gradle.kts" | sed 's/.*"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Android APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Rename APK
        run: |
          APK_FILE=$(find "Android, iOS y web/app/build/outputs/apk/release" -name "*.apk" | head -n 1)
          cp "$APK_FILE" "KiosquitoApp [${{ env.VERSION }}].apk"

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build
          
          # Crear la estructura de IPA (Payload folder)
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r "../../KiosquitoApp [${{ env.VERSION }}].ipa" Payload/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || format('manual-{0}', env.VERSION) }}
          name: Kiosquito Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            KiosquitoApp [*.apk
            KiosquitoApp [*.ipa
          body: |
            ## Notas de Lanzamiento - V.${{ env.VERSION }}
            - Binarios reales generados.
            - **Instrucción para iOS**: Descarga el archivo .ipa y úsalo con Sideloadly para firmarlo con tu Apple ID gratuito.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
